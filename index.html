<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS • PC + Phone</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script></head>
<body><header><div><h1>NEXUS</h1><small>AI CAMERA CONTROL</small></div><div id="net" class="pill">OFFLINE</div></header>
<main><section class="viewer"><img id="feed" src="/stream"><canvas id="overlay"></canvas><div class="cross"></div></section>
<section class="side">
<div class="card"><h2>AI CONFIGURATION</h2>
<label>Target description<input id="target" placeholder="red cup, blue bottle, chair"></label>
<div class="tw"><label>Confidence<input id="conf" type="range" min=".25" max=".95" step=".05" value=".55"><b id="confv">55%</b></label>
<label>Tracking speed<input id="track" type="range" min="10" max="500" value="180"><b id="trackv">180</b></label></div>
<label>AI mode<select id="mode"><option>Object detection</option><option>Vision-language (CLIP)</option></select></label>
<div class="row"><button id="scan">SCAN</button><button id="lock">LOCK TARGET</button><button id="unlock">UNLOCK</button></div>
<p id="aiStatus">AI: loading…</p></div>
<div class="card"><h2>VOICE</h2><div class="row"><button id="voice">VOICE ON</button><button id="listen">🎙 LISTEN</button></div><p id="voiceStatus">Say: “lock onto the red cup”</p></div>
<div class="card"><h2>NANO ESP32</h2><label>Nano IP<input id="nano" placeholder="192.168.1.100"></label><button id="connect">CONNECT NANO</button><p id="hardware">Pan 0° • Tilt 90°</p></div>
<div class="card"><h2>MANUAL CONTROL</h2><div class="pad"><span></span><button data-c="up">▲</button><span></span><button data-c="left">◀</button><button id="stop">STOP</button><button data-c="right">▶</button><span></span><button data-c="down">▼</button><span></span></div>
<label>Pan speed<input id="ps" type="range" min="20" max="500" value="180"></label><label>Tilt speed<input id="ts" type="range" min="5" max="90" value="35"></label></div>
<button id="estop" class="danger">EMERGENCY STOP</button></section></main><footer>PC webcam → NEXUS → Wi‑Fi → Nano ESP32 • Phone uses /mobile.html</footer>
<script src="app.js"></script></body></html>
